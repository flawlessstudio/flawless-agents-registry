name: Validate Registry

on:
  push:
    branches: [main]
    paths:
      - 'registry/**'
      - 'schemas/**'
  pull_request:
    paths:
      - 'registry/**'
      - 'schemas/**'

jobs:
  validate:
    name: Registry Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate JSON syntax (all files)
        run: |
          echo "=== JSON Syntax Check ==="
          FAILED=0
          while IFS= read -r -d '' f; do
            python3 -c "import json,sys; json.load(open('$f'))" \\
              && echo "  OK: $f" \\
              || { echo "  FAIL: $f"; FAILED=1; }
          done < <(find registry schemas -name '*.json' -print0)
          [ $FAILED -eq 0 ] || exit 1

      - name: Validate candidates against schema
        run: node scripts/validate-schema.mjs

      - name: Validate stack recipes against schema
        run: node scripts/validate-recipes.mjs

      - name: Validate root index files against schema
        run: |
          echo "=== Registry Index Validation ==="
          npx ajv validate \\
            -s schemas/registry.schema.json \\
            -d registry/registry.core.json \\
            --spec=draft7 --strict=false
          npx ajv validate \\
            -s schemas/registry.schema.json \\
            -d registry/registry.watchlist.json \\
            --spec=draft7 --strict=false

      - name: Count registry entries
        run: node scripts/stats.mjs
